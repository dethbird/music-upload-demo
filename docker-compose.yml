services:
  # Postgres is provided by the host system service (already running on :5432).
  # To use a containerised Postgres instead, uncomment the block below, stop the
  # host service first: sudo systemctl stop postgresql, and create the DB manually.
  #
  # postgres:
  #   image: postgres:15
  #   environment:
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: postgres
  #     POSTGRES_DB: music
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U postgres"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5

  # Redis is provided by the host system service (redis is already running on :6379).
  # To use a containerised Redis instead, uncomment the block below and stop the
  # host service first: sudo systemctl stop redis
